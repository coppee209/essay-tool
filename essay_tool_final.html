<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#F0F4F8;color:#1a2636;min-height:100vh}
header{background:#1E3A5F;color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:12px}

.container{max-width:820px;margin:0 auto;padding:1.5rem 1rem}

.cp{color:#3B6D11;font-size:16px;flex-shrink:0;margin-top:1px}
.cf{color:#993C1D;font-size:16px;flex-shrink:0;margin-top:1px}
.cn{font-size:12px;color:#888;margin-top:2px}
.ref-section{margin-bottom:1.5rem}
.ref-label{font-size:13px;font-weight:700;color:#555;margin-bottom:5px;display:flex;align-items:center;gap:7px}
.ref-prompt{font-size:13px;color:#888;font-style:italic;margin-bottom:6px;line-height:1.5}
.ref-ta{width:100%;font-size:14px;line-height:1.6;padding:.75rem 1rem;border:1px solid #d0d8e4;border-radius:9px;background:#fafafa;color:#1a2636;resize:vertical;font-family:inherit;min-height:80px}
.ref-ta:focus{outline:2px solid #1E3A5F;background:#fff}
.done-banner{background:#EAF3DE;border:1px solid #C0DD97;border-radius:9px;padding:1rem 1.25rem;display:flex;align-items:center;gap:10px;margin-bottom:1.5rem;color:#27500A;font-size:14px}
.print-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;background:transparent;color:#888;border:1px solid #d0d8e4;border-radius:9px;font-size:13px;cursor:pointer}
.print-btn:hover{background:#f0f4f8}
.student-bar{background:#fff;border:0.5px solid #d0d8e4;border-radius:10px;padding:1rem 1.25rem;margin-bottom:1.25rem}
.student-fields{display:flex;gap:1rem;flex-wrap:wrap;align-items:flex-end}
.field-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:150px}
.field-label{font-size:12px;color:#888;font-weight:600}
.field-input{font-size:13px;padding:7px 10px;border:1px solid #d0d8e4;border-radius:7px;background:#fafafa;color:#1a2636;width:100%}
.field-input:focus{outline:2px solid #1E3A5F;background:#fff}
.field-ro{background:#f0f4f8;color:#666;cursor:default}
@media print{header,.step-bar,.btn-primary,.btn-outline,.nav-row,.print-btn,.api-bar{display:none!important}.panel{display:block!important}.container{padding:0}}

  <button class="step-tab active" id="tab1" onclick="goStep(1)">&#9998; 貼上作文</button>

  <button class="step-tab" id="tab3" onclick="goStep(3)">&#128172; 課堂反思</button>

<div class="panel active" id="panel1">
  <div class="card">
    <p style="font-size:14px;color:#888;margin-bottom:.75rem">將學生英語作文貼在下方，AI 將依所選文體的教學標準進行批改。</p>
    <textarea id="essay-input" rows="13" placeholder="Paste the essay here..."></textarea>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:.5rem;flex-wrap:wrap;gap:8px">
      <span style="font-size:13px;color:#aaa" id="wc">0 words</span>
      <button class="btn-primary" id="analyze-btn" onclick="analyzeEssay()">&#10022; 開始批改</button>

      <div class="spinner"></div>
      <span>AI 正在批改，請稍候…</span>

</div>

    <button class="btn-outline" onclick="goStep(2)">&#8592; 回到批改</button>
    <button class="print-btn" onclick="window.print()">&#128424; 列印反思單</button>
  </div>
</div>

</div>
<script>
let feedbackData=null,apiKey='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';

// Auto date
const today=new Date();
document.getElementById('essay-date').value=today.getFullYear()+'/'+(today.getMonth()+1).toString().padStart(2,'0')+'/'+today.getDate().toString().padStart(2,'0');

function fillStudentId(){
  const v=document.getElementById('student-name').value;
  document.getElementById('student-id').value=v?v.split('|')[1]:'';
}

function saveKey(){apiKey=document.getElementById('api-key-input').value.trim();if(apiKey.startsWith('sk-')){document.getElementById('api-status').style.display='inline';document.getElementById('api-key-input').value='••••••••••••';}}
const ei=document.getElementById('essay-input');
ei.addEventListener('input',()=>{const w=ei.value.trim().split(/\s+/).filter(Boolean).length;document.getElementById('wc').textContent=w+' word'+(w!==1?'s':'');});
function goStep(n){if((n===2||n===3)&&!feedbackData)return;[1,2,3].forEach(i=>{document.getElementById('panel'+i).classList.toggle('active',i===n);document.getElementById('tab'+i).classList.toggle('active',i===n);});}
const gc={
narrative:{label:'Narrative',zh:'記敘文',
sf:'topic sentence stating the main event; events in strict chronological (time) order; time order signals: Finally, First, Later, Meanwhile, Next, Now, Soon, At last, After that, After a while, The next day, In the morning; specific descriptive details; concluding sentence',
gf:'past tense consistency; comma after time order signals at sentence start (exception: Then/Soon/Now usually no comma)',
wf:'vivid specific verbs (not went/said/got), sensory details, varied time signal words',
cl:['Has a clear topic sentence stating the main event or experience','Events are in correct chronological (time) order','Uses time order signals correctly (Finally, Then, Next, After that, At last, Meanwhile...)','Comma used after time order signals at sentence start (except Then/Soon/Now)','Includes specific descriptive details','Has a concluding sentence'],
ee:''},
descriptive:{label:'Descriptive',zh:'描寫文',
sf:'topic sentence giving overall impression (controlling idea); consistent spatial order (top-to-bottom, left-to-right, far-to-near, outside-to-inside); spatial order signals: at the top of, in the center, on the left, in front of, inside, next to, between, behind, in back of, across; paragraph unity (no off-topic sentences)',
gf:'spatial order signals as prepositional phrases; present tense for descriptions',
wf:'sensory details (sight, sound, smell, touch, taste), vivid adjectives, specific nouns, colors/sizes/shapes/textures',
cl:['Has a topic sentence giving the overall impression (controlling idea)','Uses a consistent spatial order pattern (top-to-bottom / far-to-near / left-to-right etc.)','Uses spatial order signals correctly (next to, in front of, at the top of, across...)','Supporting sentences appeal to the senses (sight, sound, smell, touch, taste)','Paragraph has unity — no off-topic sentences','Has a concluding sentence'],
ee:''},
process:{label:'Process',zh:'程序文',
sf:'thesis statement with clear topic + controlling idea + predictor; all steps covered in correct chronological order; appropriate graphic organizer (Organizer 1: all steps in one body paragraph; Organizer 2: materials then steps; Organizer 3: steps divided across paragraphs)',
gf:'chronological connectors — transitions: First, Second, Next, Then, After that, At this point, Later on, Finally; subordinating conjunctions: After, Before, Since, When, While; prepositions: After, Before, Prior to; comma after transitions and adverb clauses at sentence start',
wf:'precise action verbs in imperative or present tense, technical vocabulary, avoiding vague instructions',
cl:['Thesis statement has: clear topic + controlling idea + predictor','All necessary steps are included (nothing missing)','Steps are in correct chronological order','Uses chronological connectors correctly (First, Next, After that, Finally, After + clause...)','Commas used correctly after transitions and adverb clauses','Consistent use of imperative or present tense throughout'],
ee:'For an essay: identify which graphic organizer pattern is used (1/2/3) and check if executed consistently.'},
comparison:{label:'Comparison/Contrast',zh:'比較文',
sf:'thesis statement identifying both subjects and basis of comparison; consistent use of ONE organizational pattern: Basic Block (similarities then differences), Block Comparison (all of A then all of B), or Point-by-Point (each body paragraph = one point about both A and B)',
gf:'comparison connectors: Likewise, Similarly, Both...and, Neither...nor, Not only...but also, Like, Similar to; contrast connectors — simple: In contrast, On the other hand, However; direct: While, Whereas, But, Yet, Unlike, In contrast to; correct punctuation for each type',
wf:'comparative adjectives/adverbs, precise academic vocabulary, avoiding repetition through synonyms, parallel grammatical structures',
cl:['Thesis statement identifies both subjects and the basis of comparison','Uses ONE consistent organizational pattern (Basic Block / Block Comparison / Point-by-Point)','Uses comparison connectors correctly (Similarly, Likewise, Both...and, Like...)','Uses contrast connectors correctly (However, On the other hand, While, Whereas, Unlike...)','Maintains cohesion and coherence between sentences and paragraphs','Uses parallel grammatical structures when comparing'],
ee:'For an essay: identify which of the three organizational patterns is used and check if maintained consistently throughout all body paragraphs.'},
cause:{label:'Cause and Effect',zh:'解釋文',
sf:'thesis statement with effective hook (cause/effect hook, general-to-specific, personal anecdote, or historical hook); valid cause-effect relationships (no oversimplification, no correlation-causation confusion); Block Pattern or Linking Pattern organization; avoiding stringy sentences',
gf:'cause-effect collocations: bring about, bring forth, give rise to, lead to, result from, feel the effects of, set the foundation for; transitions: therefore, as a result, consequently; adjective+noun: immediate cause, underlying cause, desired/full/modest effect; avoiding stringy sentences (replace and/but/because chains with transitions)',
wf:'academic causal vocabulary, specific evidence and examples, adjective+noun collocations (immediate cause, underlying cause, desired effect)',
cl:['Has an effective hook (cause/effect, general-to-specific, personal anecdote, or historical)','Thesis statement clearly states the cause-effect relationship','Cause-effect relationships are valid (no oversimplification or correlation errors)','Uses cause-effect connectors and collocations correctly','Avoids stringy sentences (no excessive and/but/because/so chains)','Uses Block Pattern or Linking Pattern consistently'],
ee:'For an essay: check that the introductory paragraph has a clear hook type and connecting sentence before the thesis statement.'}
};
const rp={
structure:{
narrative:["Look at your topic sentence. Does it clearly state the main event or experience? Rewrite it here to make it stronger.","Are all your events in correct time order? Is there any part that feels out of sequence? Identify it.","Which time order connectors did you use? List two you could add or replace to vary your writing."],
descriptive:["Read your topic sentence. Does it give the reader a clear overall impression (controlling idea)? Rewrite it here if needed.","What spatial order pattern did you use? Was it consistent throughout? If not, where did it break down?","Find one sentence that might be off-topic (breaks paragraph unity). Write it here. How would you fix it?"],
process:["Read your thesis statement. Does it have a clear topic, controlling idea, AND predictor? Identify each part, or rewrite the thesis here.","Are there any steps that are missing or unclear? Which step needs more detail? Write an improved version.","Which graphic organizer pattern did you use (1, 2, or 3)? Did you follow it consistently?"],
comparison:["Identify your organizational pattern (Basic Block / Block Comparison / Point-by-Point). Find one place where it was inconsistent.","Find one place where you moved from comparison to contrast. Which connector did you use? Could a different one be more precise?","Read your thesis statement. Does it clearly name both subjects AND the basis of comparison? Rewrite it here."],
cause:["What type of hook did you use (cause/effect, general-to-specific, personal anecdote, or historical)? How could you make it stronger?","Did you use Block Pattern or Linking Pattern? Identify one paragraph and explain how it follows the pattern.","Read your thesis statement. Does it clearly state what causes or effects you will discuss? Rewrite it here if needed."]
},
grammar:{
narrative:["Find one time order signal from the feedback. Write the original sentence and your corrected version with proper punctuation.","Did you use 'Then', 'Soon', or 'Now'? These do NOT need a comma. Check your essay and write the corrected version here.","Write a new sentence using a time order PHRASE you did NOT use (e.g., 'After a while,' / 'The next day,' / 'At last,')."],
descriptive:["Find one spatial order signal from the feedback. Write the original sentence and an improved version.","Did you use spatial order signals at sentence beginnings? Check that they are prepositional phrases, not full clauses.","Write two new sentences describing a place, each using a different spatial order signal from the list taught in class."],
process:["Find one chronological connector from the feedback. Write the original sentence and your corrected version.","Did you use any subordinating conjunctions (After, Before, When, While)? Write one sentence and check the comma placement.","Rewrite one sentence by replacing 'and' or 'but' with an appropriate transition (First/Next/After that/Finally)."],
comparison:["Find one comparison or contrast connector from the feedback. Write the original sentence and your corrected version.","Did you use 'While' or 'Whereas' correctly? Write a new sentence using one of them to contrast two ideas from your topic.","Write one sentence using 'Not only...but also' and one using 'Unlike' — use ideas from your essay topic."],
cause:["Find a stringy sentence in your essay. Rewrite it by dividing it into two or three sentences using transitions instead of 'and/but/because/so'.","Write a new sentence using one of the phrasal verb collocations: 'give rise to', 'lead to', 'result from', or 'bring about'.","Write a sentence using one adjective+noun collocation: 'the immediate cause', 'the underlying cause', 'the desired effect', or 'a modest effect'."]
},
wordchoice:{
narrative:["Find one vague verb in your essay (e.g., went, said, got, did). Replace it with a more vivid, specific verb.","Did you include sensory details? Add one new sentence that appeals to a sense you did NOT use (sight/sound/smell/touch/taste).","Pick one word the feedback flagged. Write two alternative words and explain which is better and why."],
descriptive:["Find one adjective in your essay. Can you replace it with a more specific or vivid one? Write the original and improved phrase.","Which sense was missing from your description? Add one new descriptive sentence here that appeals to that sense.","Find one noun in your essay. Can you make it more specific? (e.g., 'tree' to 'twisted old oak tree') Write the improved phrase."],
process:["Find one action verb in your essay. Is it precise enough for a process description? Replace it with a more specific technical verb.","Did you repeat any word too often? Identify it and write two alternatives you could use instead.","Pick one word choice suggestion from the feedback and explain in your own words why that word is better."],
comparison:["Find one place where you repeated a word instead of using a synonym. Write a sentence with a more precise word choice.","Write a new comparison sentence using a comparative adjective (more/less + adjective, or -er form).","Pick one everyday word from your essay and replace it with a more academic alternative. Explain why it is better."],
cause:["Find one vague or general statement in your essay. Rewrite it with a specific detail or example to strengthen the cause-effect relationship.","Did you use any cause-effect collocations from class? If not, rewrite one sentence to include 'give rise to', 'lead to', or 'result from'.","Find one sentence with 'because' or 'so'. Rewrite it using a more academic connector (therefore, consequently, as a result, thus)."]
},
overall:{
narrative:["What is the most vivid moment in your narrative? What specific technique (sensory detail, vivid verb, time signal) made it effective?","If you could add one more detail to bring your story to life, what would it be and where would you put it?","What is one specific goal you will set for your next narrative writing?"],
descriptive:["Read your paragraph as a reader. Can the reader visualize the place clearly? Which part creates the clearest picture and why?","Does your paragraph have perfect unity? Find any sentence that might be slightly off-topic and write how you would fix it.","What is one specific writing skill from this unit (spatial order, sensory details, unity) you want to keep practicing?"],
process:["Could someone follow your instructions and successfully complete the process? Which step is the most unclear and how would you fix it?","Why did you choose the graphic organizer pattern you used? Would a different pattern have worked better?","What is one thing you will do differently in your next process essay?"],
comparison:["Did your essay help the reader understand BOTH similarities and differences clearly? Which was stronger in your essay?","Read your conclusion. Does it go beyond just restating your points? How could you make it more meaningful?","What is one writing skill from this unit (connectors, organizational pattern, parallel structure) you want to keep practicing?"],
cause:["Does your essay explain WHY things happen, not just WHAT happens? Find one place where you could add more explanation.","Is your cause-effect relationship valid? How would you defend your analysis against someone who says it is oversimplification?","What is one real-world cause-effect relationship you now want to write about using the skills from this unit?"]
}
};
function getPrompt(cat,genre){const arr=rp[cat][genre];return arr[(ei.value.length+cat.length)%arr.length];}
async function analyzeEssay(){
  if(!apiKey){alert('請先輸入 API 金鑰！');return;}
  const studentVal=document.getElementById('student-name').value;
  if(!studentVal){alert('請先選擇學生姓名！');return;}
  const essay=ei.value.trim();
  if(!essay||essay.length<30){alert('請先貼上作文內容！');return;}
  const genre=document.getElementById('genre-select').value;
  const type=document.getElementById('type-select').value;
  const cfg=gc[genre];
  document.getElementById('analyze-btn').disabled=true;
  document.getElementById('loading1').style.display='flex';
  const sys=`You are an English writing coach for Taiwanese first-year university students (B1 level, CEFR) in an English Composition (I) course. You are evaluating a ${type} in the genre of ${cfg.label} (${cfg.zh}).
GENRE-SPECIFIC TEACHING CRITERIA:
Structure: ${cfg.sf}
Grammar: ${cfg.gf}
Word choice: ${cfg.wf}
${cfg.ee?'Essay-specific: '+cfg.ee:''}
Checklist: ${cfg.cl.join('; ')}
Return ONLY a valid JSON object (no markdown, no extra text):
{"scores":{"structure":7,"grammar":6,"wordchoice":8,"overall":7},"checklist":[{"item":"checklist item","pass":true,"note":"specific observation"}],"structure":{"summary":"one specific sentence","points":["point 1","point 2","point 3"]},"grammar":{"summary":"one specific sentence","points":["point 1","point 2","point 3"]},"wordchoice":{"summary":"one specific sentence","points":["point 1","point 2","point 3"]},"overall":{"summary":"one sentence","strengths":"specific strength","suggestions":"top suggestion"},"highlights":[{"text":"exact phrase from essay","type":"g","comment":"brief note"},{"text":"exact phrase","type":"s","comment":"brief note"},{"text":"exact phrase","type":"w","comment":"brief note"}]}
Scores 1-10. Types: g=grammar, s=structure, w=word choice. Use EXACT phrases from essay for highlights. Keep all feedback in English. Be specific and encouraging.`;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1200,system:sys,messages:[{role:'user',content:'Please analyze this student essay:\n\n'+essay}]})});
    const data=await res.json();
    if(data.error)throw new Error(data.error.message);
    const raw=data.content.map(b=>b.text||'').join('');
    const clean=raw.replace(/```json|```/g,'').trim();
    feedbackData=JSON.parse(clean);
    feedbackData._genre=genre;feedbackData._type=type;
    renderFeedback(essay,genre,type);
    renderReflection(genre);
    document.getElementById('tab2').style.color='#3B6D11';
    goStep(2);
  }catch(e){alert('批改時發生錯誤：'+e.message);}
  document.getElementById('loading1').style.display='none';
  document.getElementById('analyze-btn').disabled=false;
}
function renderFeedback(essay,genre,type){
  const d=feedbackData,cfg=gc[genre];
  const sl={structure:'Structure',grammar:'Grammar',wordchoice:'Word Choice',overall:'Overall'};
  const cats=['structure','grammar','wordchoice','overall'];
  let ht=essay.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if(d.highlights)d.highlights.forEach(h=>{const t=h.type||'g';const esc=h.text.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');try{ht=ht.replace(new RegExp(esc,'g'),`<mark class="${t}" title="${h.comment.replace(/"/g,"'")}">${h.text}</mark>`);}catch(e){}});
  ht=ht.replace(/\n/g,'<br>');
  let chk='';
  if(d.checklist&&d.checklist.length){chk=`<div class="card"><div class="fb-header"><span class="cat-badge cat-${genre}">${cfg.label} Checklist</span></div>${d.checklist.map(c=>`<div class="check-item"><span class="${c.pass?'cp':'cf'}">${c.pass?'&#10003;':'&#10007;'}</span><div><div>${c.item}</div><div class="cn">${c.note}</div></div></div>`).join('')}</div>`;}
  let sName=document.getElementById('student-name').value.split('|')[0];
  let sId=document.getElementById('student-id').value;
  let sTitle=document.getElementById('essay-title').value||'（未填題目）';
  let sDate=document.getElementById('essay-date').value;
  let html=`<div style="background:#f0f4f8;border-radius:9px;padding:.75rem 1rem;margin-bottom:1rem;font-size:13px;display:flex;gap:1.5rem;flex-wrap:wrap">
    <span><strong>姓名：</strong>${sName}</span>
    <span><strong>學號：</strong>${sId}</span>
    <span><strong>題目：</strong>${sTitle}</span>
    <span><strong>日期：</strong>${sDate}</span>
  </div>
  <div class="genre-pill">${cfg.label} &middot; ${type==='essay'?'Essay':'Paragraph'}</div>
  <div class="score-row">${cats.map(c=>`<div class="score-item"><div class="score-label">${sl[c]}</div><div class="score-val">${d.scores[c]}<span style="font-size:14px;color:#aaa;font-weight:400">/10</span></div></div>`).join('')}</div>
  <div class="card"><div style="font-size:13px;font-weight:700;color:#888;margin-bottom:6px">Annotated text</div>
  <div class="legend"><div class="leg-item"><div class="leg-dot" style="background:#B5D4F4"></div>Structure</div><div class="leg-item"><div class="leg-dot" style="background:#F5C4B3"></div>Grammar</div><div class="leg-item"><div class="leg-dot" style="background:#C0DD97"></div>Word choice</div><div style="font-size:11px;color:#bbb;margin-left:auto">hover for notes</div></div>
  <div class="ht">${ht}</div></div>${chk}`;
  ['structure','grammar','wordchoice'].forEach(c=>{html+=`<div class="card"><div class="fb-header"><span class="cat-badge cat-${c}">${sl[c]}</span><span style="font-size:13px;color:#888">${d[c].summary}</span></div><ul style="padding-left:1.25rem;font-size:14px;line-height:1.85;color:#1a2636">${d[c].points.map(p=>`<li>${p}</li>`).join('')}</ul></div>`;});
  html+=`<div class="card"><div class="fb-header"><span class="cat-badge cat-overall">Overall</span><span style="font-size:13px;color:#888">${d.overall.summary}</span></div><div style="font-size:14px;line-height:1.8"><p style="margin-bottom:8px"><strong style="color:#3B6D11">Strengths: </strong>${d.overall.strengths}</p><p><strong style="color:#E8703A">Top suggestion: </strong>${d.overall.suggestions}</p></div></div>`;
  document.getElementById('feedback-content').innerHTML=html;
}
function renderReflection(genre){
  const cfg=gc[genre];
  const cats=['structure','grammar','wordchoice','overall'];
  const labels={structure:'Structure',grammar:'Grammar',wordchoice:'Word Choice',overall:'Overall'};
  let html=`<div class="done-banner">&#10003; 批改完成！請根據 AI 的反饋，完成下方的課堂反思。</div><p style="font-size:13px;color:#888;margin-bottom:1.25rem">文體：<strong>${cfg.label} (${cfg.zh})</strong></p>`;
  cats.forEach(c=>{const prompt=getPrompt(c,genre);html+=`<div class="ref-section"><div class="ref-label"><span class="cat-badge cat-${c}">${labels[c]}</span></div><div class="ref-prompt">${prompt}</div><textarea class="ref-ta" placeholder="Write your reflection here..." rows="3"></textarea></div>`;});
  document.getElementById('reflection-content').innerHTML=html;
}
</script>
</body>
